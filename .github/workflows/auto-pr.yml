name: Auto PR

"on":
  push:
    branches: ["feature/**"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.AUTO_PR_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -eu
          existing=$(gh pr list --repo "$GH_REPO" --base develop --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists for $BRANCH"
            exit 0
          fi

          git fetch origin develop --quiet
          commits=$(git rev-list --count origin/develop..HEAD)
          if [ "$commits" -eq 0 ]; then
            echo "No commits between develop and $BRANCH; skipping pull request."
            exit 0
          fi

          title=$(git log --reverse --pretty=%s origin/develop..HEAD | head -n 1)
          body=$(git log --reverse --pretty=%b origin/develop..HEAD | head -n 1)

          if [ -z "$title" ]; then
            title="Automated pull request for $BRANCH"
          fi
          if [ -z "$body" ]; then
            body="Automated pull request for $BRANCH."
          fi

          gh pr create --repo "$GH_REPO" --base develop --head "$BRANCH" --title "$title" --body "$body"
