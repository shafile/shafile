services:
  shafile:
    build: .
    image: shafile:latest
    ports:
      - "3000:3000"
    environment:
      SHAFILE_DATA_DIR: /app/data
      MAX_SHARE_BYTES: "${MAX_SHARE_BYTES:-5368709120}"
      MAX_STORAGE_BYTES: "${MAX_STORAGE_BYTES:-53687091200}"
      PASSWORD_KDF_MIN_MEMORY: "${PASSWORD_KDF_MIN_MEMORY:-65536}"
      PASSWORD_KDF_MIN_ITERATIONS: "${PASSWORD_KDF_MIN_ITERATIONS:-3}"
      CLEANUP_BUDGET: "${CLEANUP_BUDGET:-3}"
      TRUST_PROXY: "${TRUST_PROXY:-false}"
      TICKET_SECRET: "${TICKET_SECRET:?Set TICKET_SECRET in .env}"
      IP_HASH_SECRET: "${IP_HASH_SECRET:?Set IP_HASH_SECRET in .env}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_SESSION_SECRET: "${TELEGRAM_SESSION_SECRET:-}"
      TELEGRAM_HASH_SECRET: "${TELEGRAM_HASH_SECRET:-}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:-}"
      TELEGRAM_MINI_APP_SHORT_NAME: "${TELEGRAM_MINI_APP_SHORT_NAME:-shafile}"
    volumes:
      - shafile-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  shafile-data:
